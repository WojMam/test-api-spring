# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/

# Application Info
spring.application.name=test-api-spring
application.version=0.8.0
application.description=Spring Boot REST API Example Project

# Security Configuration
jwt.secret.key=mysecretkey12345mysecretkey12345mysecretkey12345mysecretkey12345
jwt.token.validity=18000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.testapispring=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.pathsToMatch=/public/**, /secure/**, /basic-auth/**, /auth/**

# Allow circular references (needed due to security configuration)
spring.main.allow-circular-references=true 